#     fetch-registry: true
#   instance:
#     prefer-ip-address: true

# Keycloak Admin Client Configuration
keycloak:
  server-url: http://localhost:8180
  realm: ecommerce
  admin:
    username: admin
    password: admin
  client-id: ecommerce-backend
  client-secret: HKB8Lume3aBENR4V8FTmmTfTd2EzTJtg

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    root: INFO
    com.ecommerce.userservice: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true