version: '3.8'

services:
  postgres-user:
    image: postgres:15-alpine
    container_name: postgres-user
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
      POSTGRES_USER: ${USER_DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-password}
    ports:
      - "${USER_DB_PORT:-5433}:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend-network

  postgres-keycloak:
    image: postgres:15-alpine
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-password}
    ports:
      - "${KEYCLOAK_DB_PORT:-5440}:5432"
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    networks:
      - backend-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-admin}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-password}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HTTP_PORT: ${KEYCLOAK_HTTP_PORT:-8180}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8180}:${KEYCLOAK_HTTP_PORT:-8180}"
    depends_on:
      - postgres-keycloak
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${KEYCLOAK_HTTP_PORT:-8180}/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  backend-network:
    driver: bridge

volumes:
  postgres-user-data:
  postgres-keycloak-data: